<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מוזמנים ואישורי הגעה</title>
    <!-- טעינת Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #eef2f5;
            padding: 15px;
            border-radius: 6px;
        }
        .stat-item {
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ניהול מוזמנים</h1>

    <!-- תקציר נתונים -->
    <div class="stats">
        <div class="stat-item">סה"כ מוזמנים: <span id="total-count">0</span></div>
        <div class="stat-item">סה"כ מגיעים: <span id="attending-count">0</span></div>
    </div>

    <!-- טבלת מוזמנים -->
    <table>
        <thead>
            <tr>
                <th>שם</th>
                <th>טלפון</th>
                <th>מגיע?</th>
                <th>כמות אורחים</th>
                <th>הערות</th>
                <th>פעולות</th>
            </tr>
        </thead>
        <tbody id="guests-table-body">
            <tr>
                <td colspan="6" style="text-align: center;">טוען נתונים...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 1. הגדרות התחברות ל-Supabase
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // החלף ב-URL שלך
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; // החלף ב-Anon Key שלך

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. טעינת נתוני האורחים והצגתם בטבלה
    async function fetchGuests() {
        const { data: guests, error } = await supabase
            .from('rsvp')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('שגיאה בטעינת הנתונים:', error.message);
            alert('שגיאה שטעינת הנתונים');
            return;
        }

        renderTable(guests);
        updateStats(guests);
    }

    // 3. רינדור הטבלה
    function renderTable(guests) {
        const tbody = document.getElementById('guests-table-body');
        tbody.innerHTML = '';

        if (!guests || guests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">אין מוזמנים עדיין</td></tr>';
            return;
        }

        guests.forEach(g => {
            const tr = document.createElement('tr');

            // ניקוי מספר טלפון עבור קישור לוואטסאפ (הסרת מקפים/רווחים)
            const cleanPhone = g.phone ? g.phone.replace(/[^0-9]/g, '') : '';
            // הפיכת 05X ל-9725X אם נדרש בשביל וואטסאפ
            const formattedPhone = cleanPhone.startsWith('0') ? '972' + cleanPhone.slice(1) : cleanPhone;
            
            const whatsappMessage = encodeURIComponent(`היי ${g.name}, משתפים איתך פרטים לגבי האירוע...`);
            const whatsappUrl = `https://wa.me/${formattedPhone}?text=${whatsappMessage}`;

            tr.innerHTML = `
                <td>${escapeHtml(g.name || '')}</td>
                <td>${escapeHtml(g.phone || '')}</td>
                <td>${g.is_coming ? 'כן' : 'לא'}</td>
                <td>${g.guests_count || 0}</td>
                <td>${escapeHtml(g.notes || '')}</td>
                <td>
                    ${cleanPhone ? `<a href="${whatsappUrl}" target="_blank" class="btn btn-whatsapp">וואטסאפ</a>` : ''}
                    <button class="btn btn-delete" onclick="deleteGuest('${g.id}', '${escapeJs(g.name)}')">מחק</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 4. עדכון סטטיסטיקות
    function updateStats(guests) {
        const total = guests.length;
        const attending = guests.reduce((sum, g) => sum + (g.is_coming ? (Number(g.guests_count) || 1) : 0), 0);

        document.getElementById('total-count').innerText = total;
        document.getElementById('attending-count').innerText = attending;
    }

    // 5. פונקציית מחיקת מוזמן לפי ID (בטוחה לגמרי)
    async function deleteGuest(id, name) {
        const confirmDelete = confirm(`האם אתה בטוח שברצונך למחוק את ${name}?`);
        if (!confirmDelete) return;

        const { error } = await supabase
            .from('rsvp')
            .delete()
            .eq('id', id);

        if (error) {
            alert('שגיאה במחיקת המוזמן: ' + error.message);
        } else {
            // הנתונים יתעדכנו אוטומטית הודות ל-Realtime, או שנקרא ל-fetchGuests בלבד
            fetchGuests();
        }
    }

    // 6. פונקציות עזר למניעת בעיות אבטחה וטקסט (XSS)
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function escapeJs(str) {
        return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    // 7. הפעלת Realtime (הקשבה לשינויים בזמן אמת בטבלה)
    function setupRealtime() {
        supabase
            .channel('public:rsvp')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rsvp' }, () => {
                fetchGuests();
            })
            .subscribe();
    }

    // הפעלה בטעינת העמוד
    window.addEventListener('DOMContentLoaded', () => {
        fetchGuests();
        setupRealtime();
    });
</script>

</body>
</html>

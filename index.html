<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy & Noa - אישור הגעה</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0;
            padding: 20px 12px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(212, 175, 55, 0.1);
            width: 100%;
            max-width: 460px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.25);
            overflow: hidden;
        }

        /* תמונה רחבה בראש הכרטיס */
        .header-banner {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .header-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0));
        }

        .content-padding {
            padding: 10px 25px 35px 25px;
        }

        .header-names {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            letter-spacing: 2px;
            color: #d4af37;
            margin: 0;
            font-weight: 800;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #d4af37;
            margin: 12px auto 18px auto;
            border-radius: 2px;
            opacity: 0.6;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.05rem;
            font-weight: 400;
        }

        /* עיצוב הטיימר */
        .countdown-container {
            background: #faf8f2;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 15px 10px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }

        .countdown-title {
            font-size: 0.85rem;
            color: #b8952d;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .timer-box {
            background: #ffffff;
            border-radius: 10px;
            padding: 8px 4px;
            border: 1px solid #f0e6cb;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .timer-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.1;
        }

        .timer-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            background: #fcfcfc;
            color: #2c3e50;
        }

        input:focus, textarea:focus {
            border-color: #d4af37;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
        }

        /* עיצוב כפתורי הבחירה (Radio Buttons) */
        .radio-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 5px;
        }

        .radio-btn-card {
            position: relative;
        }

        .radio-btn-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-btn-card label {
            display: block;
            text-align: center;
            padding: 12px 4px;
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            color: #555;
            margin: 0;
        }

        .radio-btn-card input[type="radio"]:checked + label {
            background: #fefcf0;
            border-color: #d4af37;
            color: #b8952d;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #d4af37 0%, #b8952d 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        #countGroup {
            overflow: hidden;
            max-height: 100px;
            opacity: 1;
            transition: all 0.3s ease-in-out;
        }

        #countGroup.hidden {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- באנר תמונה רחב -->
    <div class="header-banner">
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" alt="Roy & Noa" id="coupleBanner">
    </div>

    <div class="content-padding">
        <div class="header-names">ROY & NOA</div>
        <div class="divider"></div>
        <p class="subtitle">נשמח מאוד לחגוג ולראותכם בין אורחינו!</p>

        <!-- טיימר ספירה לאחור -->
        <div class="countdown-container">
            <div class="countdown-title">⏱️ עוד נשאר לחתונה:</div>
            <div class="timer-grid">
                <div class="timer-box">
                    <div class="timer-number" id="days">00</div>
                    <div class="timer-label">ימים</div>
                </div>
                <div class="timer-box">
                    <div class="timer-number" id="hours">00</div>
                    <div class="timer-label">שעות</div>
                </div>
                <div class="timer-box">
                    <div class="timer-number" id="minutes">00</div>
                    <div class="timer-label">דקות</div>
                </div>
                <div class="timer-box">
                    <div class="timer-number" id="seconds">00</div>
                    <div class="timer-label">שניות</div>
                </div>
            </div>
        </div>

        <!-- טופס אישור הגעה -->
        <form id="rsvpForm" onsubmit="submitRSVP(event)">
            <div class="form-group">
                <label for="name">שם מלא</label>
                <input type="text" id="name" required placeholder="הכנס שם ושם משפחה">
            </div>

            <div class="form-group">
                <label for="phone">מספר טלפון</label>
                <input type="tel" id="phone" required placeholder="050-0000000">
            </div>

            <div class="form-group">
                <label>האם תגיעו לחגוג איתנו?</label>
                <div class="radio-options">
                    <div class="radio-btn-card">
                        <input type="radio" id="attendingYes" name="attending" value="yes" checked onchange="toggleCountField(true)">
                        <label for="attendingYes">מגיע/ה</label>
                    </div>
                    <div class="radio-btn-card">
                        <input type="radio" id="attendingMaybe" name="attending" value="maybe" onchange="toggleCountField(false)">
                        <label for="attendingMaybe">אעדכן בהמשך</label>
                    </div>
                    <div class="radio-btn-card">
                        <input type="radio" id="attendingNo" name="attending" value="no" onchange="toggleCountField(false)">
                        <label for="attendingNo">לא מגיע/ה</label>
                    </div>
                </div>
            </div>

            <div class="form-group" id="countGroup">
                <label for="count">כמות אורחים</label>
                <input type="number" id="count" min="1" value="1">
            </div>

            <div class="form-group">
                <label for="notes">הערות / ברכות</label>
                <textarea id="notes" rows="3" placeholder="משהו שחשוב שנדע? (רגישויות, מנות מיוחדות...)"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">אישור הגעה</button>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hmafronrwuxjizfkhxju.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lTp_YIawnPvil699Ikc_Sw_5KnnJZPp';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // מנגנון הטיימר לתאריך 06/01/2027
    const weddingDate = new Date('2027-01-06T19:30:00').getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = weddingDate - now;

        if (distance < 0) {
            const container = document.querySelector('.countdown-container');
            if (container) {
                container.innerHTML = '<div class="countdown-title">🎉 היום זה היום! 🎉</div>';
            }
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function toggleCountField(show) {
        const countGroup = document.getElementById('countGroup');
        if (show) {
            countGroup.classList.remove('hidden');
        } else {
            countGroup.classList.add('hidden');
        }
    }

    async function submitRSVP(event) {
        event.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'שולח...';

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const attendingStatus = document.querySelector('input[name="attending"]:checked').value;
        const count = attendingStatus === 'yes' ? parseInt(document.getElementById('count').value) : 0;
        const notes = document.getElementById('notes').value;

        try {
            const { data, error } = await supabaseClient
                .from('rsvps')
                .insert([{ name, phone, attending: attendingStatus, count, notes }]);

            if (error) throw error;

            alert('תודה רבה! אישור ההגעה התקבל בהצלחה.');
            document.getElementById('rsvpForm').reset();
            toggleCountField(true);
        } catch (err) {
            console.error('Error submitting RSVP:', err);
            alert('אירעה שגיאה בשליחה, אנא נסה שוב.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'אישור הגעה';
        }
    }
</script>

</body>
</html>

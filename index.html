<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy & Noa - Wedding Invitation</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #d4af37;
            --primary: #2c3e50;
            --bg-color: #faf9f6;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            border: 1px solid #eaeaea;
        }

        .hero-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .content {
            padding: 30px 25px;
        }

        .title-names {
            font-family: 'Cinzel', 'Assistant', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }

        .subtitle-wedding {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .divider {
            height: 2px;
            width: 60px;
            background-color: var(--accent);
            margin: 15px auto 25px auto;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1a252f;
        }

        .success-msg {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="couple.jpg" alt="Roy & Noa" class="hero-img" onerror="this.style.display='none'">
    
    <div class="content">
        <div class="title-names">Roy & Noa</div>
        <div class="subtitle-wedding">מתחתנים! ✨</div>
        
        <div class="divider"></div>
        <p style="color: #666; margin-bottom: 25px;">נשמח מאוד לראותכם חוגגים איתנו! אנא אשרו את הגעתכם:</p>

        <form id="rsvpForm">
            <div class="form-group">
                <label>שם מלא</label>
                <input type="text" id="guestName" required placeholder="הכנס שם מלא">
            </div>

            <div class="form-group">
                <label>מספר טלפון</label>
                <input type="tel" id="guestPhone" required placeholder="0500000000">
            </div>

            <div class="form-group">
                <label>מגיעים?</label>
                <select id="attending" required>
                    <option value="yes">מגיעים בשמחה! 🎉</option>
                    <option value="no">לצערי לא נוכל להגיע 😢</option>
                </select>
            </div>

            <div class="form-group">
                <label>כמות אורחים (כולל אותך)</label>
                <input type="number" id="guestCount" min="1" max="10" value="1" required>
            </div>

            <div class="form-group">
                <label>הערות / ברכה לזוג</label>
                <textarea id="guestNotes" rows="3" placeholder="רגישויות למזון, ברכות..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">שליחת אישור הגעה</button>
        </form>

        <div id="successMessage" class="success-msg">
            תודה רבה! אישור ההגעה שלך התקבל בהצלחה ❤️
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hmafronrwuxjizfkhxju.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lTp_YIawnPvil699Ikc_Sw_5KnnJZPp';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('rsvpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'שולח...';
        btn.disabled = true;

        const name = document.getElementById('guestName').value;
        const phone = document.getElementById('guestPhone').value;
        const attending = document.getElementById('attending').value === 'yes';
        const count = parseInt(document.getElementById('guestCount').value) || 1;
        const notes = document.getElementById('guestNotes').value;

        try {
            const { error } = await supabaseClient.from('rsvp').insert([
                { name, phone, attending, count, notes }
            ]);

            if (error) throw error;

            document.getElementById('rsvpForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        } catch (err) {
            alert('שגיאה בשמירה: ' + err.message);
            console.error(err);
            btn.innerText = 'שליחת אישור הגעה';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אישור הגעה לחתונה</title>
    
    <!-- Tailwind CSS לעיצוב יוקרתי ומותאם לטלפון -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Secular+One&display=swap" rel="stylesheet">
    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Assistant', sans-serif; }
        .font-title { font-family: 'Secular One', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/40 min-h-screen flex items-center justify-center p-4">

    <!-- כרטיס ההזמנה -->
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-amber-200/70 overflow-hidden p-6 text-center">
        
        <!-- תמונת הזוג -->
        <div class="w-full h-64 rounded-2xl overflow-hidden mb-6 border-2 border-amber-400 shadow-md relative">
            <!-- שים את התמונה שלך ושל ארוסתך באותה תיקיה בשם couple.jpg -->
            <img src="couple.jpg" onerror="this.src='https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=800'" alt="תמונת הזוג" class="w-full h-full object-cover">
        </div>

        <h1 class="font-title text-3xl text-amber-700 mb-1">אנחנו מתחתנים! 💍</h1>
        <p class="text-gray-600 mb-6 font-medium">נשמח מאוד לראותכם חוגגים איתנו</p>

        <!-- טופס RSVP -->
        <form id="rsvpForm" class="space-y-4 text-right">
            <div>
                <label class="block font-semibold text-gray-700 mb-1 text-sm">שם מלא *</label>
                <input type="text" id="fullName" placeholder="ישראל ישראלי" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none transition">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1 text-sm">מספר טלפון נייד *</label>
                <input type="tel" id="phone" placeholder="0501234567" pattern="[0-9]{9,10}" required class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none transition">
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-1 text-sm">אישור הגעה *</label>
                <select id="status" required onchange="toggleGuestCount()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none transition bg-white">
                    <option value="מגיע/ה">מגיע/ה 🎉</option>
                    <option value="לא מגיע/ה">לצערי לא אוכל להגיע 💔</option>
                </select>
            </div>

            <div id="guestCountGroup">
                <label class="block font-semibold text-gray-700 mb-1 text-sm">כמות משתתפים (כולל אותך)</label>
                <input type="number" id="guestCount" value="1" min="1" max="10" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none transition">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 text-lg">
                אישור הגעה
            </button>
        </form>
    </div>

    <script>
        // חיבור ישיר ומאומת ל-Supabase שלך!
        const SUPABASE_URL = 'https://hmafronrwuxjizfkhxju.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtYWZyb25yd3V4aml6ZmtoeGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzIxNDEsImV4cCI6MjEwMDY0ODE0MX0.sBVh1pf4ZgvEDsMs0TRX9DMpg5uIj9dwPkk2UMWm-IQ';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleGuestCount() {
            const status = document.getElementById('status').value;
            document.getElementById('guestCountGroup').style.display = (status === 'לא מגיע/ה') ? 'none' : 'block';
        }

        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'שולח...';

            const fullName = document.getElementById('fullName').value.trim();
            let phone = document.getElementById('phone').value.replace(/[^0-9]/g, '');
            const status = document.getElementById('status').value;
            const guestCount = status === 'מגיע/ה' ? parseInt(document.getElementById('guestCount').value) : 0;

            try {
                const { data, error } = await _supabase
                    .from('guests')
                    .insert([{ full_name: fullName, phone: phone, status: status, guest_count: guestCount }]);

                if (error) throw error;

                alert('תודה! אישור ההגעה התקבל בהצלחה ❤️');
                this.reset();
                toggleGuestCount();
            } catch (err) {
                console.error('Error inserting data:', err);
                alert('אירעה שגיאה בשליחת הטופס.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'אישור הגעה';
            }
        });
    </script>
</body>
</html>

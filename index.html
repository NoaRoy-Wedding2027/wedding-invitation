<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy & Noa - אישור הגעה</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0;
            padding: 20px 15px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(212, 175, 55, 0.08);
            width: 100%;
            max-width: 460px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
        }

        /* עיצוב התמונה העליונה */
        .couple-img-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #b8952d 100%);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.25);
        }

        .couple-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #fff;
            display: block;
        }

        .header-names {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #d4af37;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .divider {
            width: 50px;
            height: 2px;
            background: #d4af37;
            margin: 15px auto 20px auto;
            border-radius: 2px;
            opacity: 0.6;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.05rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            background: #fcfcfc;
            color: #2c3e50;
        }

        input:focus, textarea:focus {
            border-color: #d4af37;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
        }

        /* עיצוב כפתורי הבחירה */
        .radio-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 5px;
        }

        .radio-btn-card {
            position: relative;
        }

        .radio-btn-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-btn-card label {
            display: block;
            text-align: center;
            padding: 12px 8px;
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
            margin: 0;
        }

        .radio-btn-card input[type="radio"]:checked + label {
            background: #fefcf0;
            border-color: #d4af37;
            color: #b8952d;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #d4af37 0%, #b8952d 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        #countGroup {
            overflow: hidden;
            max-height: 100px;
            opacity: 1;
            transition: all 0.3s ease-in-out;
        }

        #countGroup.hidden {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- תמונת בני הזוג -->
    <div class="couple-img-wrapper">
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=400&q=80" alt="Roy & Noa" class="couple-img" id="couplePhoto">
    </div>

    <div class="header-names">ROY & NOA</div>
    <div class="divider"></div>
    <p class="subtitle">נשמח מאוד לחגוג ולראותכם בין אורחינו!</p>

    <form id="rsvpForm" onsubmit="submitRSVP(event)">
        <div class="form-group">
            <label for="name">שם מלא</label>
            <input type="text" id="name" required placeholder="הכנס שם ושם משפחה">
        </div>

        <div class="form-group">
            <label for="phone">מספר טלפון</label>
            <input type="tel" id="phone" required placeholder="050-0000000">
        </div>

        <div class="form-group">
            <label>האם תגיעו לחגוג איתנו?</label>
            <div class="radio-options">
                <div class="radio-btn-card">
                    <input type="radio" id="attendingYes" name="attending" value="yes" checked onchange="toggleCountField(true)">
                    <label for="attendingYes">מגיע/ה</label>
                </div>
                <div class="radio-btn-card">
                    <input type="radio" id="attendingMaybe" name="attending" value="maybe" onchange="toggleCountField(false)">
                    <label for="attendingMaybe">אעדכן בהמשך</label>
                </div>
                <div class="radio-btn-card">
                    <input type="radio" id="attendingNo" name="attending" value="no" onchange="toggleCountField(false)">
                    <label for="attendingNo">לא מגיע/ה</label>
                </div>
            </div>
        </div>

        <div class="form-group" id="countGroup">
            <label for="count">כמות אורחים</label>
            <input type="number" id="count" min="1" value="1">
        </div>

        <div class="form-group">
            <label for="notes">הערות / ברכות</label>
            <textarea id="notes" rows="3" placeholder="משהו שחשוב שנדע? (רגישויות, מנות מיוחדות...)"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">אישור הגעה</button>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://hmafronrwuxjizfkhxju.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lTp_YIawnPvil699Ikc_Sw_5KnnJZPp';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function toggleCountField(show) {
        const countGroup = document.getElementById('countGroup');
        if (show) {
            countGroup.classList.remove('hidden');
        } else {
            countGroup.classList.add('hidden');
        }
    }

    async function submitRSVP(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'שולח...';

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const userNotes = document.getElementById('notes').value.trim();
        const attendingValue = document.querySelector('input[name="attending"]:checked').value;

        const isYes = (attendingValue === 'yes');
        const isMaybe = (attendingValue === 'maybe');
        
        const guestCount = isYes ? (parseInt(document.getElementById('count').value) || 1) : 0;
        
        let finalNotes = userNotes;
        if (isMaybe) {
            finalNotes = userNotes ? `[אעדכן בהמשך] ${userNotes}` : '[אעדכן בהמשך]';
        }

        try {
            const { error } = await supabaseClient
                .from('rsvp')
                .insert([
                    {
                        name: name,
                        phone: phone,
                        attending: isYes,
                        count: guestCount,
                        notes: finalNotes
                    }
                ]);

            if (error) throw error;

            alert('תודה רבה! האישור התקבל בהצלחה.');
            document.getElementById('rsvpForm').reset();
            toggleCountField(true);
        } catch (err) {
            console.error(err);
            alert('אירעה שגיאה בשליחת הטופס. אנא נסה שוב.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'אישור הגעה';
        }
    }
</script>

</body>
</html>
